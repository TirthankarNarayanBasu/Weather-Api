<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-shell">
        <div class="ambient-glow"></div>
        <section class="box" aria-label="Weather search">
            <div class="eyebrow"><span class="sun-icon">☼</span> Live conditions</div>
            <h1>Weather,<br><span>at a glance.</span></h1>
            <p class="intro">Discover the current weather anywhere in the world.</p>

            <div class="search-row">
                <label class="sr-only" for="city">City name</label>
                <input type="text" id="city" placeholder="Search a city..." autocomplete="address-level2">
                <button onclick="getWeather()">Search <span aria-hidden="true">→</span></button>
            </div>

            <div class="weather-result" aria-live="polite">
                <div class="location">
                    <span class="location-pin">●</span>
                    <h2 id="name"></h2>
                </div>
                <div class="temperature" id="temp"></div>
                <p class="description" id="desc"></p>
            </div>
            <p id="error" role="alert"></p>
            <p class="tip">Tip: Try cities like Tokyo, London, or New York</p>
        </section>
        <footer>Powered by OpenWeather <span>•</span> Updated in real time</footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
